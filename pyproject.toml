[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegraph"
version = "0.1.0"
description = "Repo knowledge graph for coding agents: requirements -> code -> tests, with line-level change impact"
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.22", "tree-sitter-python>=0.21", "networkx>=3.0", "pyyaml>=6.0"]

[project.optional-dependencies]
quality = ["ruff", "pyright"]
mcp = ["mcp>=1.2"]
dev = ["pytest"]

[project.scripts]
tracegraph = "tracegraph.cli:main"
tracegraph-mcp = "tracegraph.mcp_server:main"

[tool.setuptools.package-data]
tracegraph = ["ui/*.html"]

[tool.setuptools.packages.find]
where = ["src"]
